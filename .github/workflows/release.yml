# Runs only for a release tag, yyyymmdd.index (20261107.1, the index counting that
# day's releases from 1): builds the wheels, tries them on every platform and
# publishes them to PyPI through trusted publishing (no API token). The tests run on
# every push to main, in test.yml; publish waits for that run on the tag's commit and
# needs it green (20261107.2 was published while its macOS test was red). A commit
# never pushed to main has no such run, so its tag does not publish.
name: release

on:
  push:
    tags: ["[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9]+"]

env:
  # uv's own Python builds include Tk; the runners' system Pythons may not.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  # The test run of this commit's push to main: waited for, then it must be green.
  # Not a second run of the tests here: what publishes is what was seen green on main.
  tested:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Wait for test.yml on this commit on main, and require success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for i in $(seq 120); do  # 30 min at most: test.yml takes about 5
            run=$(gh run list --workflow test.yml --commit "$sha" --branch main --event push \
                    --limit 1 --json databaseId,status,conclusion \
                    -q '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion)"') || run=""  # retried
            read -r id status conclusion <<< "$run"
            echo "test run of $sha on main: ${run:-none yet}"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::test run $id ended $conclusion: https://github.com/$GITHUB_REPOSITORY/actions/runs/$id"
              exit 1
            fi
            sleep 15
          done
          echo "::error::no finished test run of $sha on main after 30 min; push the commit to main first"
          exit 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the version is derived from the git tags
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      # The plain wheel stays, for what no wheel below fits (musl, an older glibc).
      - name: Add one wheel per platform with the FreeRDP client inside
        run: uv run --no-project python scripts/bundle_client.py dist/*-any.whl
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # one runner for every wheel with a client
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest,
             macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      # the client's one need from the host; a desktop has it, a runner may not
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y -q libpulse0
      # By version, from a folder of wheels: uv picks the wheel as it does from PyPI.
      - name: Install the wheel of this platform and start its client
        shell: bash
        run: |
          version=$(ls dist/*-any.whl | sed -E 's/.*freerdp_tk-([^-]+)-.*/\1/')
          uv run --isolated --no-project --find-links dist --with "freerdp-tk==$version" python -c "
          import freerdp_tk, freerdp_tk.app as a
          print(freerdp_tk.__version__, a.find_clients())
          assert str(a.BUNDLED) in a.find_clients(), 'this wheel has no client'
          assert a.client_major_version(str(a.BUNDLED)) == 3, a.client_start_error(str(a.BUNDLED))
          "

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tested, build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
