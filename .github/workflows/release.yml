# Builds on every push and pull request. Pushing a release tag, the version
# with no prefix (0.2.0; v0.1.x before 2026-10-25), also publishes that
# version to PyPI through trusted publishing (no API token).
name: release

on:
  push:
    branches: [main]
    tags: ["[0-9]*", "v*"]
  pull_request:

env:
  # uv's own Python builds include Tk; the runners' system Pythons may not.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the version is derived from the git tags
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - name: Install the wheel and import it
        shell: bash
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c \
            "import freerdp_tk, freerdp_tk.app as a; print(freerdp_tk.__version__, a.find_clients())"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
