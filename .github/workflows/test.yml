# Runs the tests on every push and pull request:
# - linux (x64): the newest Ubuntu release (ubuntu:rolling follows new releases by
#   itself) with its own Python, Tk and FreeRDP 3 client, in a virtual X server
# - windows (x64) and macos (arm64): uv's Python, which includes Tk, on the
#   runners' own desktop; no FreeRDP client there, so the real-client test skips
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:rolling
    steps:
      - uses: actions/checkout@v5
      - name: Install Python, Tk, keyring, pytest, Xvfb, xdotool and the FreeRDP SDL client
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            python3 python3-tk python3-keyring python3-pytest xvfb xauth xdotool freerdp3-sdl
      - run: xvfb-run -a -s "-screen 0 1400x1000x24" python3 -m pytest -v -rs
        env:
          PYTHONPATH: src

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group test pytest -v -rs
