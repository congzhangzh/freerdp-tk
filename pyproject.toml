[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "freerdp-tk"
dynamic = ["version"]
description = "A small cross-platform Tkinter launcher for the FreeRDP 3 SDL remote desktop client"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cong Zhang", email = "lucien.c.zhang@gmail.com" }]
requires-python = ">=3.10"
# The system keyring for saved passwords; on Linux it brings SecretStorage
# and cryptography along.
dependencies = ["keyring>=25"]
keywords = ["freerdp", "rdp", "remote desktop", "tkinter", "launcher"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/congzhangzh/freerdp-tk"
Issues = "https://github.com/congzhangzh/freerdp-tk/issues"

# A GUI script: on Windows it starts without a console window.
[project.gui-scripts]
freerdp-tk = "freerdp_tk.app:main"

# The version comes from the git tag, which has no prefix: tag 0.2.0 builds 0.2.0
# (the older tags v0.1.x build 0.1.x).
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[dependency-groups]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
